<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Signal AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B1120;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 28px;
      background: linear-gradient(90deg, #3B82F6, #A855F7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: #1E293B;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    select, button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      margin-top: 10px;
    }
    select {
      background: #334155;
      color: white;
    }
    button {
      background: #3B82F6;
      color: white;
      font-weight: bold;
      margin-top: 20px;
    }
    .signal {
      display: none;
      text-align: center;
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
    .call { background: #065F46; }
    .put { background: #7F1D1D; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SIGNAL AI</h1>
  </div>

  <div class="card">
    <label>Валютна пара</label>
    <select id="pair">
      <option value="EUR/USD">EUR/USD</option>
      <option value="GBP/USD">GBP/USD</option>
      <option value="USD/JPY">USD/JPY</option>
      <option value="AUD/USD">AUD/USD</option>
    </select>

    <label style="margin-top:15px; display:block;">Таймфрейм</label>
    <select id="time">
      <option value="1">1 хвилина</option>
      <option value="3">3 хвилини</option>
      <option value="5">5 хвилин</option>
    </select>

    <button onclick="getSignal()">Отримати сигнал</button>
  </div>

  <div id="result" class="signal"></div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    window.Telegram.WebApp.setHeaderColor('#0B1120');
    window.Telegram.WebApp.setBackgroundColor('#0B1120');

    function getSignal() {
      const pair = document.getElementById('pair').value;
      const time = document.getElementById('time').value;
      const result = document.getElementById('result');

      // Поки що проста логіка (пізніше зробимо розумнішу)
      const isCall = Math.random() > 0.5;
      const confidence = Math.floor(Math.random() * 20) + 70;

      result.style.display = 'block';
      result.className = 'signal ' + (isCall ? 'call' : 'put');
      result.innerHTML = `
        ${pair}<br>
        ${isCall ? 'CALL ↑' : 'PUT ↓'}<br>
        ${time} хв<br>
        Впевненість: ${confidence}%
      `;
    }
  </script>
</body>
</html>
