<html lang="uk">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Signal AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B1120;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 14px;
      padding-bottom: 50px;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
    }
    .header h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #3B82F6, #A855F7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .lang-switch {
      position: absolute;
      right: 0;
      top: 0;
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      background: #334155;
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #3B82F6;
    }
    .card {
      background: #1E293B;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
      color: #94A3B8;
      display: block;
      margin-bottom: 3px;
    }
    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      border: none;
      font-size: 15px;
      margin-top: 5px;
    }
    select {
      background: #334155;
      color: white;
    }
    button {
      background: #3B82F6;
      color: white;
      font-weight: 600;
      margin-top: 10px;
    }
    button.secondary {
      background: #475569;
    }
    button.success {
      background: #059669;
    }
    button.pocket {
      background: #F97316;
      margin-top: 8px;
    }
    .signal {
      display: none;
      text-align: center;
      padding: 18px 14px;
      border-radius: 14px;
      margin-top: 10px;
      font-size: 16px;
      line-height: 1.5;
    }
    .call { background: #065F46; }
    .put { background: #7F1D1D; }
    .wait { background: #334155; }
    .time-entry {
      margin-top: 12px;
      padding: 11px;
      background: rgba(0,0,0,0.3);
      border-radius: 11px;
      font-size: 20px;
      font-weight: bold;
      color: #FBBF24;
    }
    .countdown {
      font-size: 14px;
      color: #FCD34D;
      margin-top: 4px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      text-align: center;
      font-size: 13px;
      margin-top: 6px;
    }
    .stats div b {
      display: block;
      font-size: 17px;
      margin-top: 2px;
    }
    .history {
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
    }
    .history-item {
      padding: 7px 0;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
    }
